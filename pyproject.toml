[build-system]
requires = [
    "setuptools >= 80",
    "setuptools_scm[toml] >= 8"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Presence of this section activates setuptools_scm, even though it's empty
write_to = "logikbench/_version.py"
write_to_template = '''
# This file is automatically generated by setuptools_scm.
# Do not edit it directly.

__version__ = "{version}"
'''

[tool.setuptools]
include-package-data = true
packages = [
    "logikbench"
]

[project]
name = "logikbench"
authors = [{name = "Zero ASIC"}]
description = "Parameterized RTL benchmark suite"
readme = "README.md"
urls = {Homepage = "https://github.com/zeroasiccorp/logikbench"}
requires-python = ">= 3.10"
license = {file = "LICENSE"}
dependencies = [
             "siliconcompiler >= 0.37.12",
             "lambdapdk >= 0.2.11",
             "lambdalib >= 0.12.3"
]
dynamic = ['version']

[project.scripts]
lb = "logikbench.apps.lb:main"

[tool.pytest.ini_options]
testpaths = "tests"
timeout = "60"

[project.optional-dependencies]
test = [
    "pytest == 8.4.2",
    "pytest-timeout == 2.4.0",
    "flake8 == 7.3.0",
    "jinja2 >= 3.0"
]
