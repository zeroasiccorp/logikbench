[build-system]
requires = [
    "setuptools >= 80",
    "setuptools_scm[toml] >= 8"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Presence of this section activates setuptools_scm, even though it's empty
write_to = "logikbench/_version.py"
write_to_template = '''
# This file is automatically generated by setuptools_scm.
# Do not edit it directly.

__version__ = "{version}"
'''

[tool.setuptools]
include-package-data = true

[tool.setuptools.exclude-package-data]
# never ship the collected results / dashboard databases (the results/ tree)
# inside the wheel. Scoped to that directory so other package data still ships
# (e.g. the vendored zeroasic FPGA architecture configs under
# targets/zeroasic, needed by 'synth_fpga -config').
"*" = ["results/*", "results/**/*"]

[tool.check-wheel-contents]
# W002 flags identical-content files at different paths. Expected here: each
# benchmark bundles its own LICENSE/SDC and some share RTL (e.g. la_dsync.v),
# so duplicate content across benchmark dirs is intentional, not a packaging bug.
ignore = ["W002"]

[tool.setuptools.packages.find]
include = ["logikbench*"]

[project]
name = "logikbench"
authors = [{name = "Zero ASIC"}]
description = "Parameterized RTL benchmark suite"
readme = "README.md"
urls = {Homepage = "https://github.com/zeroasiccorp/logikbench"}
requires-python = ">= 3.10"
license = {file = "LICENSE"}
keywords = ["benchmark", "rtl", "verilog", "fpga", "asic", "synthesis", "eda"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Operating System :: OS Independent",
]
dependencies = [
             "siliconcompiler >= 0.37.12",
             "lambdapdk >= 0.2.15",
             "lambdalib >= 0.13.1",
             "umi >= 0.4.15",
             "jinja2 >= 3.0"
]
dynamic = ['version']

[project.scripts]
lb = "logikbench.apps.lb:main"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-n auto"
timeout = "60"
markers = [
    "eda: test requires external EDA tools (yosys, iverilog) on PATH",
]

[project.optional-dependencies]
test = [
    "pytest == 9.1.1",
    "pytest-xdist==3.8.0",
    "pytest-split==0.11.0",
    "pytest-timeout == 2.4.0",
    "tclint==0.8.0",
    "flake8 == 7.3.0"
]
