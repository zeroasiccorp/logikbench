name: Regression
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pure_python_ci:
    name: "Python Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install .[test]

      - name: Run pytest
        run: |
          python3 -m venv .venv
          . .venv/bin/activate

          # everything except EDA-tool tests (lint, setup); smoke runs in eda_ci
          pytest -n auto -m "not eda"

  eda_ci:
    name: "Run EDA"
    runs-on: ubuntu-latest
    # prebuilt image with the EDA tools (iverilog, etc.) on PATH
    container: ghcr.io/siliconcompiler/sc_runner:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run pytest (eda)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          python3 -m venv .venv
          . .venv/bin/activate

          pip install --upgrade pip
          pip install -e .[test]

          # iverilog smoke tests (and any other eda-marked tests)
          pytest -n auto -m "eda" --verbose
